<body class="bg-[#e7eef1] min-h-screen flex items-center justify-center p-0 sm:p-4 font-body antialiased selection:bg-accent-tint selection:text-accent-fill">
<!-- Mobile Frame Container (393px × 852px) -->
<main class="w-[393px] h-[852px] bg-background relative overflow-hidden flex flex-col justify-between shadow-2xl rounded-[44px] border-[6px] border-[#181c1e]/10">
<!-- Top Safe Area Status Bar Clearance (~50px) -->
<div class="absolute top-0 left-0 w-full h-[50px] z-30 flex items-center justify-between px-7 pt-3 text-text-primary pointer-events-none select-none">
<span class="font-numeral text-xs font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5 opacity-90">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-[17px]" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Hero Visual Area (Top 55% of the frame) -->
<section class="relative w-full h-[55%] flex-shrink-0">
<!-- Decorative Organic Backdrop Blobs -->
<div class="absolute -top-12 -left-12 w-64 h-64 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>
<div class="absolute top-28 -right-10 w-56 h-56 rounded-full bg-support/20 blur-2xl pointer-events-none"></div>
<!-- Hero Photo Container with 32px rounded bottom corners -->
<div class="relative w-full h-full overflow-hidden rounded-b-[32px] shadow-[0_8px_24px_rgba(12,27,31,0.06)] bg-surface-alt">
<img alt="Learner practicing vocabulary outdoors" class="w-full h-full object-cover object-center transform scale-100 hover:scale-105 transition-transform duration-700 ease-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7JO8HcTngn5nxjtVkC-BvH_TWn9azTCoTvojnVmsTlRKPD7PRr-lPldgLDUXayoi36L8dAha2KClZ9ES6OZzf1rBVHrOH2y7uZGUH4P-zBICxTHelHYjKf2lcMekys7xyVZqnalW61I5k_CpLkqOqaEYoiQ7I35F_fD37lUycZqulMf1Q3G7Vz66Jrp9eJHlDx0qMX28lZR5YSdxYU7VSz1Vhx6Ms3t4z22IVTNTZPPzkUZ5Dc2dE02HsdtTfvcadCeO9AyMfllUitw"/>
<!-- Subtle gradient overlay strictly for soft edge transition at the very bottom -->
<div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-text-primary/15 to-transparent pointer-events-none"></div>
</div>
</section>
<!-- Content & Action Container (Remaining ~45%) -->
<section class="flex-1 flex flex-col justify-between px-space-xl pt-space-lg pb-[34px] relative z-20">
<!-- Headline & Value Proposition -->
<div class="flex flex-col items-start space-y-space-sm pt-1">
<!-- App Branding Label -->
<span class="font-label text-label text-accent-fill tracking-wide font-bold uppercase select-none">
          LexiLoop
        </span>
<!-- Main Display Headline -->
<h1 class="font-display text-display text-text-primary font-bold tracking-tight">
          Learn 5 new English words a day
        </h1>
<!-- Secondary Supporting Text -->
<p class="font-body text-body text-text-secondary leading-normal pt-0.5">
          Short lessons, quick quizzes, real progress
        </p>
</div>
<!-- Action Buttons Anchored to Bottom -->
<div class="w-full flex flex-col items-center space-y-space-xs mt-auto">
<!-- Primary Pill Button (56px tall) -->
<button class="w-full h-[56px] rounded-full bg-accent-fill hover:bg-accent-pressed active:scale-[0.99] transition-all duration-150 flex items-center justify-center shadow-sm cursor-pointer select-none focus:outline-none focus:ring-2 focus:ring-accent-fill/30" type="button">
<span class="font-label text-label text-on-primary font-medium tracking-tight">
            Get started
          </span>
</button>
<!-- Secondary Text Button -->
<button class="w-full py-3 text-center rounded-full hover:bg-accent-tint/40 active:scale-[0.99] transition-colors duration-150 cursor-pointer select-none focus:outline-none" type="button">
<span class="font-label text-label text-accent-fill font-medium">
            I already have an account
          </span>
</button>
</div>
<!-- Home Indicator Area Clearance (~34px reserved with centered pill indicator) -->
<div class="w-full flex justify-center items-end pt-1 pointer-events-none select-none">
<div class="w-32 h-1 bg-text-primary/20 rounded-full"></div>
</div>
</section>

</body></html>
