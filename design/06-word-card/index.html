<!-- Mobile Frame Container (393px width, full height mobile screen) -->
<main class="w-full max-w-[393px] h-[852px] bg-background text-text-primary flex flex-col justify-between relative overflow-hidden shadow-2xl sm:rounded-[44px]">
<!-- Top System & Lesson Bar (No bottom nav; lesson full-screen mode) -->
<header class="w-full pt-[52px] px-margin pb-3 flex items-center justify-between gap-3 z-20 select-none">
<!-- Close 'X' Button -->
<button aria-label="Close lesson" class="w-9 h-9 rounded-full bg-surface-alt flex items-center justify-center text-text-primary active:scale-95 transition-transform duration-150 focus:outline-none focus:ring-2 focus:ring-accent-fill" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<!-- Center Progress Track (8px pill track #EAF5F7, filled 40% with #00A9CE / primary-fixed) -->

<div class="h-full bg-[#00A9CE] rounded-full transition-all duration-500 ease-out" style="width: 40%;"></div>
</div>
<!-- Right Progress Counter (JetBrains Mono, 13px, font-medium, #46595E) -->
<div class="shrink-0 flex items-center pl-1">
<span class="font-numeral text-caption text-text-secondary tracking-tight">4 / 10</span>
</div>

<div class="w-full aspect-[4/3] rounded-[16px] overflow-hidden bg-surface-alt relative mb-4">

<span class="inline-flex items-center justify-center h-8 px-3 rounded-full bg-accent-tint text-accent-fill font-label text-caption leading-none">

<h1 class="font-display text-display text-text-primary mb-1 tracking-tight">
          commute

<span class="font-body text-[15px] leading-5 text-text-secondary">

          </span>
<button aria-label="Listen to pronunciation" class="h-10 pl-3 pr-4 rounded-full bg-accent-tint text-accent-fill flex items-center gap-1.5 active:scale-95 active:bg-surface-alt transition-all focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="volume_up">volume_up</span>
<span class="font-caption text-caption text-accent-fill">Listen</span>
</button>

<div class="mb-4">
<p class="font-caption text-caption text-text-tertiary uppercase tracking-wider mb-1">

          </p>

<!-- Interactive feedback micro-interaction -->
<script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Haptic feel visual micro-state
        btn.classList.add('brightness-95');
        setTimeout(() => btn.classList.remove('brightness-95'), 120);
      });
    });
  </script>
