<!-- Interactive script for Micro-interactions -->
<script>
    function toggleSoundState(button) {
      const isChecked = button.getAttribute('aria-checked') === 'true';
      const knob = document.getElementById('toggle-knob');
      
      if (isChecked) {
        button.setAttribute('aria-checked', 'false');
        button.classList.remove('bg-accent-fill');
        button.classList.add('bg-outline-variant');
        knob.classList.remove('translate-x-6');
        knob.classList.add('translate-x-0.5');
      } else {
        button.setAttribute('aria-checked', 'true');
        button.classList.remove('bg-outline-variant');
        button.classList.add('bg-accent-fill');
        knob.classList.remove('translate-x-0.5');
        knob.classList.add('translate-x-6');
      }
    }
  </script>
