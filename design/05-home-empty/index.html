<div class="w-full bg-surface rounded-[24px] p-4 flex flex-col items-center custom-shadow">

<p class="text-body font-body text-text-secondary max-w-[280px]">

</button>
<!-- Secondary Footnote / Caption -->
<p class="text-caption font-caption text-text-tertiary text-center">

        </p>

<button class="flex flex-col items-center justify-center text-accent-fill dark:text-secondary-fixed font-caption transition-transform duration-150 active:scale-95" type="button">
