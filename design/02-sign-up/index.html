<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;

    /* Ambient Elevation shadow treatment per style guide */

      box-shadow: 0 1px 2px rgba(12,27,31,0.04), 0 8px 24px rgba(12,27,31,0.06);
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-highest min-h-screen flex items-center justify-center p-0 m-0 font-body antialiased selection:bg-accent-tint selection:text-accent-fill">
<!-- Mobile Frame Container (Fixed 393px by 852px viewport) -->
<main class="w-[393px] h-[852px] bg-background relative flex flex-col justify-between overflow-hidden shadow-2xl rounded-[44px] border border-hairline-divider">
<!-- Top Safe Area Padding (~59px) & Navigation Bar -->
<header class="w-full pt-[59px] px-5 flex flex-col shrink-0">
<div class="h-10 flex items-center">
<!-- Back Navigation Button -->
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-text-primary hover:bg-accent-tint active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<!-- Header Title & Subtitle Section -->
<div class="mt-4">
<h1 class="font-display text-display text-text-primary">Create your account</h1>
<p class="font-body text-body text-text-secondary mt-1">Save your words and progress</p>
</div>
</header>
<!-- Main Content Canvas / Scrollable Form Container -->
<section class="flex-1 px-5 pt-7 pb-2 flex flex-col justify-between">
<!-- Input Fields Cluster (16px to 20px rhythm) -->
<div class="flex flex-col gap-4">
<!-- Field 1: Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-primary" for="full-name">Name</label>
<div class="relative w-full">
<input class="w-full h-[52px] bg-surface rounded-xl border border-control-border px-4 font-body text-body text-text-primary focus:outline-none focus:ring-2 focus:ring-accent-fill focus:border-transparent transition-all placeholder:text-text-tertiary" id="full-name" type="text" value="Maya Chen"/>
</div>
</div>
<!-- Field 2: Email (Active Focus State as requested) -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-primary" for="email">Email</label>
<div class="relative w-full">
<input class="w-full h-[52px] bg-surface rounded-xl border border-transparent ring-2 ring-accent-fill px-4 font-body text-body text-text-primary focus:outline-none transition-all placeholder:text-text-tertiary" id="email" type="email" value="maya.chen@mail.com"/>
</div>
</div>
<!-- Field 3: Password with mask and toggle icon -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-primary" for="password">Password</label>
<div class="relative w-full flex items-center">
<input class="w-full h-[52px] bg-surface rounded-xl border border-control-border pl-4 pr-12 font-body text-body text-text-primary tracking-widest focus:outline-none focus:ring-2 focus:ring-accent-fill focus:border-transparent transition-all placeholder:text-text-tertiary" id="password" type="password" value="supersecretpassword"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 w-8 h-8 rounded-full flex items-center justify-center text-text-secondary hover:bg-surface-alt active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Helper text -->
<span class="font-caption text-caption text-text-tertiary pl-0.5">At least 8 characters</span>
</div>
</div>
<!-- Action Group -->
<div class="flex flex-col gap-4 mt-auto pt-6">
<!-- Primary Action Button -->
<button class="w-full h-14 bg-accent-fill text-surface rounded-full font-label text-label flex items-center justify-center active:bg-accent-pressed active:scale-95 transition-all ambient-elevation" type="button">
          Create account
        </button>
<!-- Hairline Divider with centered 'or' badge -->
<div class="relative flex items-center justify-center my-0.5">
<div class="w-full border-t border-hairline-divider absolute"></div>
<span class="relative bg-background px-3 font-caption text-caption text-text-tertiary">or</span>
</div>
<!-- Secondary Action Button -->
<button class="w-full h-14 bg-surface text-text-primary border-[1.5px] border-control-border rounded-full font-label text-label flex items-center justify-center hover:bg-surface-alt active:scale-95 transition-all" type="button">
          Continue as guest
        </button>
<!-- Footnote / Legal link -->
<p class="text-center font-label text-label text-text-secondary pt-1">
          By continuing you agree to the <a class="text-accent-fill hover:underline focus:outline-none font-label" href="#terms">Terms</a>
</p>
</div>
</section>
<!-- Bottom Safe Area Clear Space (~34px) with iOS-style Home Indicator -->
<footer class="h-[34px] w-full shrink-0 flex items-center justify-center">
<div class="w-32 h-1 bg-text-primary/20 rounded-full"></div>
</footer>
</main>
<!-- Interactive script for password reveal toggle -->
<script>
    const passwordInput = document.getElementById('password');
    const toggleButton = passwordInput.nextElementSibling;
    const toggleIcon = toggleButton.querySelector('span');

    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      if (isPassword) {
        toggleIcon.textContent = 'visibility_off';
        passwordInput.classList.remove('tracking-widest');
      } else {
        toggleIcon.textContent = 'visibility';
        passwordInput.classList.add('tracking-widest');
      }
    });
  </script>
</body></html>
